<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klipárna</title>
  <meta name="description" content="Schvalování denních klipů">
  <meta name="theme-color" content="#0c0a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klipárna">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="sun"></div><div class="grid"></div></div>

  <!-- login -->
  <section id="login" class="screen login" hidden>
    <div class="login-card">
      <img src="/icon.svg" alt="" class="login-logo">
      <h1>Klipárna</h1>
      <p class="muted">Každý večer nové klipy. Ty jen schválíš.</p>
      <form id="loginForm" autocomplete="on">
        <input id="pw" type="password" name="password" placeholder="Heslo" autocomplete="current-password" required>
        <button class="btn primary big" type="submit">Vstoupit</button>
        <p id="loginErr" class="err" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- app -->
  <section id="app" class="screen" hidden>
    <header class="top">
      <div class="brand"><img src="/icon.svg" alt=""><span>Klipárna</span></div>
      <button id="refresh" class="icon-btn" aria-label="Obnovit"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
    </header>

    <div id="hero" class="hero"></div>

    <div class="chips" role="tablist" aria-label="Jazyk">
      <button class="chip on" data-lang="all">Vše</button>
      <button class="chip" data-lang="cs">🇨🇿 CZ</button>
      <button class="chip" data-lang="en">🇺🇸 EN</button>
    </div>

    <main id="feed" class="feed" aria-live="polite"></main>

    <section id="notesView" class="notes" hidden>
      <h2>Napiš mi, co chceš</h2>
      <p class="muted">Třeba „víc Herdyna“, „udělej kompilaci policajtů“ nebo „Speed míň“. Přečtu si to při dalším běhu.</p>
      <form id="noteForm">
        <textarea id="noteText" rows="4" placeholder="Co mám příště udělat jinak?" maxlength="2000"></textarea>
        <button class="btn primary big" type="submit">Odeslat</button>
      </form>
      <ul id="notesList" class="notes-list"></ul>
    </section>

    <nav class="tabs" aria-label="Sekce">
      <button class="tab on" data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Nové</span><b id="cNew" class="badge" hidden></b></button>
      <button class="tab" data-tab="approved"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Schválené</span><b id="cApp" class="badge" hidden></b></button>
      <button class="tab" data-tab="uploaded"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>Nahrané</span></button>
      <button class="tab" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Napiš mi</span></button>
    </nav>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <template id="cardTpl">
    <article class="card">
      <div class="vid">
        <video playsinline preload="none" loop></video>
        <button class="play" aria-label="Přehrát"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        <div class="meta-top"><span class="pill streamer"></span><span class="pill lang"></span></div>
        <div class="meta-bot"><span class="pill dur"></span><span class="pill views"></span></div>
      </div>
      <div class="body">
        <p class="hook"></p>
        <label class="lbl">Název</label>
        <div class="field"><input class="title" maxlength="100"><button class="copy" data-copy="title" aria-label="Kopírovat název">Kopírovat</button></div>
        <label class="lbl">Popis</label>
        <div class="field"><textarea class="desc" rows="2" maxlength="2000"></textarea><button class="copy" data-copy="desc" aria-label="Kopírovat popis">Kopírovat</button></div>
        <div class="actions"></div>
      </div>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
