name = "clipapp"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

[[kv_namespaces]]
binding = "KV"
id = "0c1a51b2f49345d6af5962e536b2bda1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clipapp-media"

# secrets (wrangler secret put ...): APP_PASSWORD, PIPELINE_TOKEN
