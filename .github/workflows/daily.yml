name: Denní klipy
on:
  schedule:
    - cron: "0 17 * * *"   # 18:00 CET / 19:00 CEST
  workflow_dispatch: {}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg + fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer
      - name: python deps
        run: pip install -q yt-dlp faster-whisper anthropic numpy
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-medium }
      - name: run
        env:
          KLIPARNA_URL: ${{ secrets.KLIPARNA_URL }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/daily.py
